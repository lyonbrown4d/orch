name: smoke-docker

on:
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Run full 4-scenario Docker Raft stack suite (placement/rollout/nextcloud/seaweed)'
        required: false
        type: boolean
        default: false
      runtime_isolation:
        description: 'Use per-node Docker-in-Docker isolation (real runtime movement)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Docker smoke
        shell: pwsh
        run: ./scripts/local-docker-smoke.ps1

      - name: Worker dispatch smoke
        shell: pwsh
        run: ./scripts/local-docker-worker-dispatch-smoke.ps1

  docker-raft-stack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Docker 3-node Raft stack smoke suite
        shell: pwsh
        run: |
          $fullSuite = '${{ github.event.inputs.full_suite }}' -eq 'true'
          $runtimeIsolation = '${{ github.event.inputs.runtime_isolation }}' -eq 'true'

          if ($fullSuite -and $runtimeIsolation) {
            task smoke:docker-raft-stack-suite-full-dind -CLI_ARGS "-TimeoutSeconds 420"
          } elseif ($fullSuite) {
            task smoke:docker-raft-stack-suite-full -CLI_ARGS "-TimeoutSeconds 360"
          } elseif ($runtimeIsolation) {
            task smoke:docker-raft-stack-suite-dind -CLI_ARGS "-TimeoutSeconds 300"
          } else {
            task smoke:docker-raft-stack-suite -CLI_ARGS "-TimeoutSeconds 300"
          }
