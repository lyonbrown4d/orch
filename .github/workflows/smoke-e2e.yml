name: smoke-e2e

on:
  workflow_dispatch:
    inputs:
      full_stack:
        description: 'Run full 4-scenario stack chain (placement/rollout/nextcloud/seaweed)'
        required: false
        type: boolean
        default: false
      runtime_isolation:
        description: 'Use per-node DinD runtime for stack scenarios'
        required: false
        type: boolean
        default: false
      timeout_seconds:
        description: 'Per-scenario timeout for stack and raft/DNS checks'
        required: false
        default: '360'

permissions:
  contents: read

jobs:
  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Single-node Docker smoke
        shell: pwsh
        run: ./scripts/local-docker-smoke.ps1

      - name: Worker dispatch smoke
        shell: pwsh
        run: ./scripts/local-docker-worker-dispatch-smoke.ps1

      - name: Raft forwarding smoke
        shell: pwsh
        run: ./scripts/local-raft-forwarding-smoke.ps1

      - name: Docker Raft stack smoke chain
        shell: pwsh
        run: |
          $fullSuite = '${{ github.event.inputs.full_stack }}' -eq 'true'
          $runtimeIsolation = '${{ github.event.inputs.runtime_isolation }}' -eq 'true'
          $rawTimeout = '${{ github.event.inputs.timeout_seconds }}'
          $timeout = 360

          if (-not [string]::IsNullOrWhiteSpace($rawTimeout)) {
            try {
              $timeout = [int]$rawTimeout
            }
            catch {
              Write-Host "Invalid timeout_seconds '$rawTimeout', using default 360"
            }
          }

          $scenarios = @('placement', 'rollout')
          if ($fullSuite) {
            $scenarios = @('placement', 'rollout', 'nextcloud', 'seaweed')
          }

          foreach ($scenario in $scenarios) {
            $args = @('-Scenario', $scenario, '-TimeoutSeconds', $timeout.ToString())
            if ($runtimeIsolation) {
              $args += @('-RuntimeIsolation', 'dind')
            }
            & './scripts/docker-raft-app-smoke.ps1' @args
          }

      - name: Collect smoke logs
        if: always()
        shell: pwsh
        run: |
          $artifactRoot = Join-Path (Get-Location) '.orch-e2e-artifacts'
          Remove-Item -LiteralPath $artifactRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null

          $logRoots = @(
            '.orch-smoke/logs',
            '.orch-worker-dispatch-smoke/logs',
            '.orch-raft-smoke/logs'
          )
          foreach ($root in $logRoots) {
            if (Test-Path $root) {
              Copy-Item -LiteralPath $root -Destination $artifactRoot -Recurse -Force
            }
          }

          Get-ChildItem -Force -Directory -Name '.orch-docker-raft-*' | ForEach-Object {
            $root = Join-Path $_ 'logs'
            if (Test-Path $root) {
              Copy-Item -LiteralPath $root -Destination $artifactRoot -Recurse -Force
            }
          }

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-e2e-logs-${{ github.run_id }}
          path: .orch-e2e-artifacts
          retention-days: 7
          if-no-files-found: ignore
