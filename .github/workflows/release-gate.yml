name: release-gate

on:
  workflow_dispatch:
    inputs:
      include_runtime:
        description: 'Run container runtime smokes in addition to raft-only checks'
        required: false
        type: boolean
        default: false
      include_e2e:
        description: 'Run extended full-chain e2e smoke after baseline and runtime checks'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install podman for runtime smoke path
        if: github.event.inputs.include_runtime == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Run local release gate entrypoint
        shell: pwsh
        run: |
          $cliArgs = @()

          if ('${{ github.event.inputs.include_runtime }}' -eq 'true') {
            $cliArgs += '-Runtime'
          }
          if ('${{ github.event.inputs.include_e2e }}' -eq 'true') {
            $cliArgs += '-E2E'
          }

          if ($cliArgs.Count -eq 0) {
            task release-gate:local
            return
          }

          task release-gate:local CLI_ARGS=$($cliArgs -join ' ')
